[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "com.brondani.osra"
description = "OSRA-CODE: the OSRA methodology (Operational Substrate Risk Audit) as software."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Marco Brondani" }]
# The software is under the Apache License 2.0; the methodology it applies is
# published separately under CC BY-SA 4.0 (LICENSE, REUSE.toml).
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "openpyxl>=3.1",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
# The MCP server for agent access. Mode C needs none of it (FR-84).
mcp = [
  "mcp>=2.2,<3",
]
dev = [
  "pytest>=8",
  "mcp>=2.2,<3",
]

[project.scripts]
osra-code = "com.brondani.osra.cli:main"

[tool.hatch.version]
path = "src/com/brondani/osra/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/com"]

# The method pack ships inside the package so that an offline installation
# works and verifies (ADR-0012), in its own directory beside the code, never
# inside it (ADR-0004).
[tool.hatch.build.targets.wheel.force-include]
"method/osra-1.2" = "com/brondani/osra_method/osra-1.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
