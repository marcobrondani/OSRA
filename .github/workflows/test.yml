name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Method pack and reference fixtures
        run: osra-code check
      - name: Tests
        run: python -m pytest
      - name: Published sensitivity figures still compute
        run: python calibration/weight_sensitivity.py

  install:
    # An installation from the built wheel, outside the repository, finds the
    # method pack inside the package and reproduces every reference result.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps -w wheelhouse .
      - run: python -m venv ../clean
      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          CLEAN="$(cd ../clean && pwd)"
          if [ -x "$CLEAN/bin/python" ]; then PY="$CLEAN/bin/python"; else PY="$CLEAN/Scripts/python"; fi
          $PY -m pip install wheelhouse/*.whl
          cd .. && $PY -m com.brondani.osra verify
