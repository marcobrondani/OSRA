# The OSRA v1.2 method pack: the methodology as data (ADR-0003).
# Every file in the pack is listed with its SHA-256 in checksums.sha256.
# The format of each file is described in docs/METHOD_PACK.md.
schema_version: 1
kind: method-pack
id: osra
version: "1.2"
methodology:
  title: The OSRA Methodology and Framework
  version: "1.2"
  document: methodology/OSRA_Architecture_v1.2.md
  includes: Corrections within v1.2 (September 2026)
calibration:
  document: calibration/OSRA_Scoring_Calibration_v1.2.md
catalogue:
  document: action-catalogue/OSRA_Action_Catalogue_v1.2.md
# The pack is licensed under the Apache License 2.0 (LICENSE and NOTICE in this
# directory). The methodology documents it is derived from are published under
# CC BY-SA 4.0 by the same author.
licence: Apache-2.0
# The order in which the engine applies the rules. Each rule may read the
# outputs of the rules before it. Rules listed under reporting are applied
# when reports are produced, not by the engine.
pipeline:
  - severity.from-impact
  - severity.tested-fallback
  - silent-failure.flag
  - trust-gap.gap
  - trust-chain.depth
  - condition.high-severity
  - condition.silent-failure
  - condition.unverified-trust
  - condition.count
  - category.assign
  - category.concentration-flag
  - scoring.horizon
  - scoring.score
  - ranking.order
reporting:
  - ranking.primary-output
# Regulatory mappings. Every clause in them has been checked against the
# primary text on EUR-Lex, and records the date (TR-16a). Changing a mapping
# never changes a category or a score (TR-16).
mappings:
  - mappings/dora.yaml
  - mappings/nis2.yaml
  - mappings/ai-act.yaml
