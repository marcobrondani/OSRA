# The OSRA-CODE error catalogue (ADR-0011). Every surface renders diagnostics
# from these entries. Codes are stable: a code is never reused for a different
# meaning. Messages are templates; logs record the code and identifiers only,
# never assessment content (TR-89).
#
# exit_code is what the command-line interface returns when the diagnostic is
# the most serious one reported: 0 for a warning, 1 for invalid assessment or
# fixture data or a failed verification, 3 for a file that cannot be read,
# 4 for an invalid method pack, 5 for an assessment another writer holds.
# Codes starting OSRA-W are warnings.
schema_version: 1
errors:
  OSRA-E101:
    title: Required field missing
    message: "{entity}: '{field}' is required."
    remedy: Add the field. Later phases need it.
    exit_code: 1
  OSRA-E102:
    title: Value not allowed
    message: "{entity}: '{field}' is {value!r}, which is not one of the allowed values."
    remedy: Use one of the values the method pack defines for this field.
    exit_code: 1
  OSRA-E103:
    title: Wrong type
    message: "{entity}: '{field}' must be {expected}, not {value!r}."
    remedy: Change the value to the expected type.
    exit_code: 1
  OSRA-E104:
    title: Wrong format
    message: "{entity}: '{field}' is {value!r}, which does not have the required format."
    remedy: Write the value in the format shown in the example.
    exit_code: 1
  OSRA-E105:
    title: Unknown field
    message: "{entity}: '{field}' is not a field of this artefact."
    remedy: Remove the field, or check its spelling against the schema.
    exit_code: 1
  OSRA-E106:
    title: Computed field entered
    message: "{entity}: '{field}' is computed by the engine and cannot be entered."
    remedy: >-
      Remove the field. Enter the evidence it is computed from instead; the
      engine decides it by the published rule (FR-32).
    exit_code: 1
  OSRA-E107:
    title: Value out of range
    message: "{entity}: '{field}' is {value!r}, which is outside the allowed range."
    remedy: Use a value within the range shown in the example.
    exit_code: 1
  OSRA-E108:
    title: Invalid value
    message: "{entity}: '{field}' is not valid: {detail}."
    remedy: Correct the value against the schema.
    exit_code: 1
  OSRA-E201:
    title: Duplicate identifier
    message: "{entity}: the identifier is used more than once in {file}."
    remedy: Give each entry its own identifier. Identifiers are never shared or reused.
    exit_code: 1
  OSRA-E202:
    title: Unknown dependency
    message: "{entity}: '{field}' refers to {value}, which is not a dependency in the Substrate Map."
    remedy: Refer to a dependency identifier from substrate.yaml, or add the dependency there first.
    exit_code: 1
  OSRA-E203:
    title: Retired identifier reused
    message: "{entity}: the identifier was retired when its entry was deleted and cannot be used again."
    remedy: Use the next free identifier (ADR-0009).
    exit_code: 1
  OSRA-E204:
    title: Duplicate scoring entry
    message: "{entity}: the dependency is scored more than once in scoring.yaml."
    remedy: Keep one scoring entry per dependency.
    exit_code: 1
  OSRA-E205:
    title: Method pack mismatch
    message: "{entity}: the assessment was made under method pack {value}, but pack {expected} is loaded."
    remedy: Load the method pack the assessment was made under, or migrate the assessment deliberately (FR-07).
    exit_code: 1
  OSRA-E301:
    title: Unsupported schema version
    message: "{entity}: schema version {value!r} cannot be read; this software reads schema version {expected}."
    remedy: Use a version of OSRA-CODE that reads this schema version.
    exit_code: 3
  OSRA-E302:
    title: File not readable
    message: "{entity}: {detail}."
    remedy: Correct the file so that it is valid UTF-8 YAML with no repeated keys.
    exit_code: 3
  OSRA-E303:
    title: File missing
    message: "{entity}: the file does not exist."
    remedy: Create the file, or point the command at the right directory.
    exit_code: 3
  OSRA-E304:
    title: Wrong kind of file
    message: "{entity}: expected a '{expected}' file, found {value!r}."
    remedy: Check that the file holds the artefact its name says it does.
    exit_code: 3
  OSRA-E401:
    title: Method pack checksum mismatch
    message: "{entity}: the file does not match the checksum recorded for the method pack."
    remedy: >-
      Restore the file, or, if the change is deliberate, record new checksums
      with 'osra-code pack rehash' and review the difference.
    exit_code: 4
  OSRA-E402:
    title: Method pack rule invalid
    message: "{entity}: {detail}."
    remedy: Correct the rule against schemas/rules.schema.json.
    exit_code: 4
  OSRA-E403:
    title: Method pack identifier duplicated
    message: "{entity}: the identifier is used more than once in the method pack."
    remedy: Give each rule, case and vocabulary value its own identifier.
    exit_code: 4
  OSRA-E404:
    title: Method pack inconsistent
    message: "{entity}: {detail}."
    remedy: Make the method pack agree with itself; the schemas, taxonomies and rules must name the same values.
    exit_code: 4
  OSRA-E405:
    title: Method pack file missing or unlisted
    message: "{entity}: {detail}."
    remedy: Every file in the pack must be listed in checksums.sha256, and every listed file must exist.
    exit_code: 4
  OSRA-E501:
    title: Fixture inconsistent
    message: "{entity}: {detail}."
    remedy: Correct the fixture against the calibration document.
    exit_code: 1
  OSRA-E601:
    title: Finding not scored
    message: "{entity}: the dependency is a {value} finding and must be scored, but scoring.yaml has no entry for it."
    remedy: Score the five factors for this dependency against the anchors (Phase 4, Step 4.2).
    exit_code: 1
  OSRA-E602:
    title: Horizon undetermined
    message: "{entity}: the dependency is a {value} finding but none of its failure modes qualifies for the materialisation horizon."
    remedy: Check the dependency's failure modes; a scored finding always has one that met a condition.
    exit_code: 1
  OSRA-W603:
    title: Tie resolution unused
    message: "{entity}: '{field}' orders {value}, which are not tied in this run."
    remedy: Remove the resolution, or update it to the findings that are tied now.
    exit_code: 0
  OSRA-E604:
    title: Register not confirmed
    message: "{entity}: the register is {value}; it must be confirmed before scoring or reporting (FR-33)."
    remedy: Review the register and confirm it with 'osra-code confirm'.
    exit_code: 1
  OSRA-E605:
    title: Register missing
    message: "{entity}: a {value} assessment requires this register, and it does not exist."
    remedy: Capture the register, or change the assessment type.
    exit_code: 1
  OSRA-E606:
    title: Reference result not reproduced
    message: "{entity}: {field} is {value!r}; the published reference value is {expected!r}."
    remedy: The engine or the method pack disagrees with the published calibration. Do not release.
    exit_code: 1
  OSRA-E607:
    title: History broken
    message: "{entity}: {detail}."
    remedy: >-
      The history was edited or truncated outside OSRA-CODE. Restore it from
      the organisation's own copy; the entries from this point on cannot be
      trusted.
    exit_code: 1
  OSRA-W608:
    title: File changed outside OSRA-CODE
    message: "{entity}: the file differs from the last version OSRA-CODE recorded."
    remedy: Review the change, then record it with 'osra-code record' so the history covers it.
    exit_code: 0
  OSRA-E609:
    title: Assessment locked
    message: "{entity}: another writer holds the assessment ({detail})."
    remedy: >-
      Wait for the other writer to finish. If no other writer is running, the
      lock is stale: rerun with --break-lock, which is recorded in the history.
    exit_code: 5
  OSRA-E610:
    title: Unknown entity
    message: "{entity}: there is no such entity in the assessment."
    remedy: Use an identifier from the registers, such as DEP-01, FM-01 or TS-01.
    exit_code: 1
  OSRA-E611:
    title: Assessment exists
    message: "{entity}: an assessment already exists in this directory."
    remedy: Choose an empty directory for a new assessment.
    exit_code: 1
  OSRA-E612:
    title: Confirmation refused
    message: "{entity}: a register cannot be confirmed through {value}; only a person, through the command line or the web UI, can confirm."
    remedy: Review the register yourself and confirm it with 'osra-code confirm' (FR-31, ADR-0005).
    exit_code: 1
  OSRA-E613:
    title: No results
    message: "{entity}: the assessment has no current results."
    remedy: Confirm the registers and run 'osra-code score' first.
    exit_code: 1
  OSRA-E614:
    title: Unrecorded changes
    message: "{entity}: {value} changed outside OSRA-CODE since it was last recorded; nothing was written."
    remedy: Review the change, record it with 'osra-code record', then repeat the command.
    exit_code: 1
